name: bootstrap
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project files
        run: |
          if [ ! -f bootstrap.tar.gz ]; then echo "nothing to unpack"; exit 0; fi
          tar xzf bootstrap.tar.gz && rm bootstrap.tar.gz
          git config user.name "Muhammad Nur Fauzan"
          git config user.email "fauzanmhmd@gmail.com"
          git add -A
          git commit -m "Add QA MCP server (tools, tests, fixtures)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01SSgp8wHtJPrhYm7WJ4whJR"
          git push
