name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Demo output in job summary
        if: matrix.node == 22
        run: |
          echo "## qa-mcp-server demo (real MCP client → server over stdio)" >> "$GITHUB_STEP_SUMMARY"
          node dist/scripts/demo.js >> "$GITHUB_STEP_SUMMARY"
